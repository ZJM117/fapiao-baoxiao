# =====================================================================
#  把镜像自动构建好、推到 GitHub 自己的容器仓库（ghcr.io）
#
#  你只需要把代码 push 上来，GitHub 就免费帮你构建镜像；
#  然后 NAS 上改成拉 ghcr.io/zjm117/fapiao-baoxiao:latest 就行 ——
#  NAS 不用装编译环境、不用等几分钟构建，几十秒就能起。
#
#  · 不需要你配任何密钥：用 GitHub 自带的 GITHUB_TOKEN 登录 ghcr.io 就够了
#  · 构建好的镜像在：  仓库页 → 右侧 Packages（或 https://github.com/ZJM117?tab=packages）
#  · 每次 push 都会重新构建并覆盖 :latest，同时留一份以提交号命名的（方便回滚）
# =====================================================================
name: 构建镜像并推送到 ghcr.io

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:          # 也可以在 GitHub 网页上手动点一下就跑

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # 推镜像到 ghcr 必须有这个权限
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      # ghcr 的镜像路径必须全小写，而 GitHub 用户名/仓库名可能有大写字母
      - name: 算出镜像名（转小写）
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 绿联/群晖/威联通这类 NAS 基本都是 x86_64，只构建 amd64 最快（约 3~5 分钟）。
          # 以后要是想跑在 arm 机器上，改成 linux/amd64,linux/arm64（会慢不少）。
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
